<table class="summary-table">
  <thead>
    <tr>
      <th>Security Category</th>
      <th>Valid</th>
      <th>Total</th>
      <th>Progress</th>
      <th>ASVS Level</th>
    </tr>
  </thead>
  <tbody>
    @for (sum of summary; track sum.securityCategory) {
      <tr [class.total-row]="sum.securityCategory === 'Total'">
        <td class="cat-name">{{ sum.securityCategory }}</td>
        <td class="center">{{ sum.validCriteria }}</td>
        <td class="center">{{ sum.totalCriteria }}</td>
        <td class="center">
          <div class="progress-cell">
            <div class="progress-bar-track">
              <div class="progress-bar-fill" [style.width.%]="sum.validityPercentage"></div>
            </div>
            <span class="progress-value">{{ sum.validityPercentage }}%</span>
          </div>
        </td>
        <td class="center">
          @if (sum.asvsLevelAcquired > 0) {
            <span class="level-badge">L{{ sum.asvsLevelAcquired }}</span>
          } @else {
            <span class="level-empty">—</span>
          }
        </td>
      </tr>
    }
  </tbody>
</table>

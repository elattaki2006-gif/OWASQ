<div class="ai-panel">
  <div class="ai-header">
    <div class="ai-title">
      <span class="ai-icon">✦</span>
      <h3>AI Assistant</h3>
    </div>
    <button class="hide-btn" (click)="closePanel.emit()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
      Close
    </button>
  </div>

  <app-tabs [activeTab]="activeTab" (tabSelected)="onTabSelected($event)"></app-tabs>

  <div class="ai-content">
    @if (aiLoading) {
      <app-spinner
        message="AI is analyzing the requirement..."
        subMessage="This may take a few seconds">
      </app-spinner>
    } @else {
      @if (aiExplanation) {
        <app-markdown-viewer [content]="aiExplanation"></app-markdown-viewer>
      } @else {
        <div class="empty">Click "Explain with AI" to get detailed analysis</div>
      }
    }
  </div>

  <div class="actions">
    <button class="refresh-btn" (click)="refreshRequested.emit()">↻ Refresh</button>
  </div>
</div>

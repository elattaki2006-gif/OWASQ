<header class="header">
  <div class="header-content">
    <div class="logo-cluster">
      <div class="shield-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
          <path d="M12 2L3 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z" fill="url(#shieldGrad)" opacity="0.15"/>
          <path d="M12 2L3 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z" stroke="url(#shieldGrad)" stroke-width="1.5" fill="none"/>
          <path d="M9 12l2 2 4-4" stroke="url(#shieldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <defs>
            <linearGradient id="shieldGrad" x1="3" y1="2" x2="21" y2="24">
              <stop offset="0%" stop-color="#06b6d4"/>
              <stop offset="100%" stop-color="#10b981"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="title-block">
        <h1>OWASP ASVS</h1>
        <span class="subtitle">Security Verification Dashboard</span>
      </div>
    </div>
    <div class="actions">
      <button class="btn-header btn-reset" (click)="resetClicked.emit()">
        <span class="btn-icon">↻</span> Reset Progress
      </button>
    </div>
  </div>
</header>
